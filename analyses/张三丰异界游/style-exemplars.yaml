exemplars:
  - id: EX-001
    status: candidate
    scene_function: 父母对孩子将来做什么各有主意，祖父循声加入，让一家三代先后亮相。
    locator: 第1节 重生异世（目录1，L25–32）
    span: [2847, 3372]
    learn:
      - 父亲闯进来先问母亲，再看孩子。两轮话里，他注意体格，她注意孩子能感知什么。
      - 父亲刚要去报信，门外的人先接上他的话。让新人物先被听见，在场者先同他说一句。
      - 前七段一直在说话，到第八段才由孩子抬头，从父亲的衣着看到身后的老人和轮椅。
    do_not_carry:
      - 新生儿自带成人观察力、四个将军儿子和家中首个魔法师这组身世安排。
      - 军装父亲站在轮椅老人背后的构图。
    evidence: [CLAIM-001, CLAIM-1405, notes/segment-001.md, sections/style-technique.md]
  - id: EX-002
    status: candidate
    scene_function: 孩子随行时看见护卫装备昂贵，跟着母亲的回答问清货从哪里来、又装在哪里。
    locator: 第5节 路上见闻（目录5，L237–245）
    span: [18348, 19206]
    learn:
      - 第一段沿着同一批人的背上、腰间、身上逐件看，直到观察者算起价钱，才把话交给长辈。
      - 长辈讲完交易为何难做，孩子只追问对方想买什么。回答列出货物，下一问就抓住眼前看不见货车这件事。
      - 最后两轮缩到手上的一个东西，长辈以自己的嫁妆作答，让经济常识落回这对母子的关系。
    do_not_carry:
      - 女王护卫的全套装备、精灵与人类的商路和用戒指装货的设定。
      - 以现代小康生活衡量异界身家的口吻和货物清单。
    evidence: [CLAIM-005, notes/segment-002.md]
  - id: EX-003
    status: candidate
    scene_function: 兄弟轮流挑坐骑，旁人的起哄把大哥的心愿推高，再由一笔漏算的重量逼他改选。
    locator: 第93节 兄弟分赃（目录93，L4648–4660）
    span: [265187, 265643]
    learn:
      - 先让一个人勉强选，接着两个人一同应和，最后才让最不合适的人跟着要。每次轮到谁就另起一段。
      - 弟弟先拿体重提醒，大哥自己算出似乎还有余量，再由弟弟补上他漏算的随身物。
      - 弟弟连理由带替代办法说了一长段，轮到大哥只回两个字，低头的动作交代他情不情愿。
    do_not_carry:
      - 四兄弟分飞龙、组战队和体重加甲剑超过载重的笑料。
      - 用现代超标说法挤兑大哥的原句。
    evidence: [CLAIM-076, notes/segment-025.md]
  - id: EX-004
    status: candidate
    scene_function: 一个人做试验连遭失败，边干边嘀咕，最后清点余料，决定先歇手。
    locator: 第195节 炼制飞剑（目录195，L9886–9888）
    span: [587331, 587777]
    learn:
      - 第一段把前两次都写出来。第二次看似有门，让他高兴半句，等手里的东西继续变化才改口。
      - 接下来几次只列出试过的东西和共同结果，把找原因的话挪到段尾，读者已经见过他的麻烦。
      - 第三段先点出他自己也累了，再点还剩哪两样可试，让人物真正停手休息。
    do_not_carry:
      - 用三昧真火试异界矿材、以龙晶和神之金作为最后库存的炼剑设定。
      - 试料之前向师父求保佑、失败后痛骂材料的具体措辞。
    evidence: [CLAIM-182, notes/segment-057.md]
  - id: EX-005
    status: candidate
    scene_function: 久别的长辈在人前见面，两人从端着架子到问候对方，最后才让晚辈退出。
    locator: 第345节 家庭风波（目录347，L18008–18016）
    span: [1251668, 1252246]
    learn:
      - 先跟着搀扶的人走进正堂，再停在坐着的人身上。把姿势写端正后，用手上东西留下的痕迹露出紧张。
      - 对视占一段，两人先拿对方的年纪搭话，来回三句以后，才有人问这些年过得怎样。
      - 一声招呼把晚辈请走，叙述跟着门外的人撤出去。连想偷听的动作也留在晚辈这边。
    do_not_carry:
      - 拐杖插进青石的夸张细节、祖父母重聚时全家准备偷听的桥段。
    evidence: [CLAIM-382, notes/segment-122.md]
  - id: EX-006
    status: candidate
    scene_function: 队伍从占领区经草原和邻国前往码头，几处不同的接待写出一路的人情冷热。
    locator: 第347节 路上经过（目录349，L18127–18131）
    span: [1260990, 1261570]
    learn:
      - 每换一处地方就换一段。把主人陪酒后的作息写成重复动作，一段话就送过了好几天。
      - 从受欢迎换到受监视时，先写吃饭的不便，再让叙述者私下交代自己到底防什么。
      - 海上几天只给半句，靠岸才放慢，先见码头的人和旗，船到跟前才认出谁来接。
    do_not_carry:
      - 沿路发银币、岳父醉送到国境、靠空间戒指避吃当地饭菜的连续安排。
      - 卡特王子、教皇迎船，以及叙述者幸灾乐祸的原话。
    evidence: [CLAIM-383, notes/segment-123.md]
  - id: EX-007
    status: candidate
    scene_function: 宾主敬酒时，让第一人称先说场面话，再私下告诉读者自己为何敢喝。
    locator: 第438节 意外惊变（目录442，L23552–23558）
    span: [1742215, 1742849]
    learn:
      - 一人举杯，另一人随即喝下。旁人急得跺脚后，再让敬酒的人问出读者也想问的问题。
      - 把对客人说的保证和只对读者承认的准备放在同一段，转入心声时仍沿用刚才谈的那杯酒。
      - 下一段容他独自把客套话驳一遍，再由对面的人接着恭维。对方始终只接得上说出口的那一层。
    do_not_carry:
      - 公主为吞并邻国敬酒、用神识查杯桌和埋伏杀手的情境。
      - 拿自己的性命担保、转头在心里粗口拆台的原句。
    evidence: [CLAIM-526, notes/segment-169.md]
  - id: EX-008
    status: candidate
    scene_function: 行人提前走出雾区，以目光能看清的先后，把陌生建筑交代给读者。
    locator: 第533节 天空之城（目录539，L29232–29237）
    span: [2226985, 2227539]
    learn:
      - 先写原以为还要走多远、实际走了多远。跨出雾区后，让叙述者单用一段承认自己吃惊。
      - 视线先抓整体轮廓，写的人中途修正对建筑的称呼，再取一个中间部位当参照，往上、往下估量。
      - 材料占一段，门前的台阶另占一段。最后停在一个日常通行上的疑点，先让读者自己看出异样。
    do_not_carry:
      - 双锥陀螺形银城、里数和高度、门外无街而台阶悬空的建筑设计。
    evidence: [CLAIM-678, notes/segment-217.md, sections/style-technique.md]
  - id: EX-009
    status: candidate
    scene_function: 交锋途中把视角交给受袭的人，让他边看边判断，认出对手时才顾得上后悔。
    locator: 第651节 天空之城震撼登场（目录658，L36011–36015）
    span: [2791706, 2792204]
    learn:
      - 一方的动作还没做完，先写他心里一紧，跟着他抬头的方向换到远处的建筑。
      - 一段只辨出窗后的眼睛，下一段才看见来物，再用一个稍长的段落写他认出其性质、想到自己怕它的缘故。
      - 直到能看清对方的脸才报出身份。段尾让第三人称滑进受袭者埋怨自己的问句。
    do_not_carry:
      - 教堂双窗藏兽眼、金色能量球、熊王现脸的揭示顺序与招式设定。
      - 窗后双眼的宝石比喻，以及敌将后悔时的骂法。
    evidence: [CLAIM-901, notes/segment-276.md, sections/style-technique.md]
  - id: EX-010
    status: candidate
    scene_function: 章末让求助者追问提议如何办到，把看似已经谈妥的事重新变成一个具体问题。
    locator: 第790节 蚩尤的烦恼（目录799，L44008–44015，章末）
    span: [3440028, 3440479]
    learn:
      - 一人问对手为什么着急，另一人报结果。让问的人自己把数字合起来，给出他的反应。
      - 用两段应酬和笑声略停一下，再让最初开口的人把话扳回自己的难题。
      - 提建议的人只用一句话，求助者一口气追问对方凭什么配合。全章收在他的声音里。
    do_not_carry:
      - 两路夺取神界位面的数目、让天使军团照剧本出兵的计策、拿父子关系作比的反问。
    evidence: [CLAIM-1184, notes/segment-344.md]
  - id: EX-011
    status: candidate
    scene_function: 两个熟人出门前商量怎么同行，互相挑出不妥之处，改完主意便分头去办。
    locator: 第816节 猎杀魔猪（目录823，L45574–45586）
    span: [3544485, 3545276]
    learn:
      - 主意从门前正在装货的小事生出来。另一个人先赞同再说有破绽，等同伴追问才点出哪里惹眼。
      - 由提议的人自己解释原因并改方案。对方只提醒一个具体同伴的难处，再给计划留个例外。
      - 把商量的结果落在递东西、转身找人的动作上。与第三方谈成的交换留给末段一笔交代。
    do_not_carry:
      - 扮作护货佣兵、收坐骑进空间球、给高个同伴单留飞马，以及免护送费换马的组合。
    evidence: [CLAIM-1231, notes/segment-356.md]
  - id: EX-012
    status: candidate
    scene_function: 商队在城门被叫停，领队独自出面应对，乘客直到被他指给军官才进入这件事。
    locator: 第493节 成神医了。（目录498，L26818–26822）
    span: [2021509, 2021952]
    learn:
      - 先从同车乘客眼里写领队平日怎样说话，一句带过几天路程，到城门才让赶来的人开口。
      - 军官只问谁领队，领队先递东西。隔一段才由军官说明来意，让读者跟领队一起明白他会错了意。
      - 最后一段先给领队两句私下懊恼，再让他赔笑、指人。停在他的手势上，把被点到的人的反应留给下段。
    do_not_carry:
      - 三百人商队、入城先送金币袋、悬赏五千金币找牧师救城主独子的安排。
      - 主角扮牧师搭商队、因领队当面指认卷入求医的桥段。
    evidence: [CLAIM-608, notes/segment-196.md]
