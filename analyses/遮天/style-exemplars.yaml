exemplars:
  - id: EX-001
    status: candidate
    scene_function: 聚会前用一通电话让老同学亮相，读者先听见两人调侃，再知道他们从前的关系。
    locator: 第2章 素问（L79–89）
    span: [3198, 3722]
    learn:
      - 放下手里的东西才提今晚的去处，用两个短段交代毕业多久、同学如今相隔多远。
      - 铃响才介绍来电人。先转述她开玩笑，让接电话的人说出第一句直接引语，她笑过才提正事。
      - 两人已经约好见面、主角已经出门，旁白才补他以前追过她，随后回到他停车等人的动作。
    do_not_carry:
      - 读医书、赴同学聚会、到商场停车等人的连续安排。
      - 旧日追求被婉拒的关系，以及用相貌和升职经历给来电人下评语的措辞。
    evidence: [CLAIM-0001, notes/segment-001.md]
  - id: EX-002
    status: candidate
    scene_function: 一顿晚饭到了结账的时候，让掌柜、孩子和客人各自说出对这笔钱的理解。
    locator: 第71章 留下来（L4537–4550）
    span: [236413, 237215]
    learn:
      - 孩子先在里屋问怎么还没关门，等她看见桌上的饭，只写吞咽和一个字的回答，把她盯着盘子的缘由留到后面。
      - 客人先伸手掏钱，掌柜替他把难处问出来。客人只答一小句，孩子接过去，连说几层委屈。
      - 大人拿留好的饭哄她，末段仍让孩子开口。她说出谁也饿着，前面盯盘子的动作才有了另一层意思。
    do_not_carry:
      - 赖账的食客、盘中鸡骨、答应留下的一条鸡腿，以及祖孙靠小饭馆度日的关系。
      - 用红苹果比孩子的脸、用补丁衣袖擦眼泪的搭配。
    evidence: [CLAIM-0021, notes/segment-021.md]
  - id: EX-003
    status: candidate
    scene_function: 在鼎内外换两次视角，让读者看着外面的人把渐渐散去的气味当成好消息。
    locator: 第95章 云蒸霞蔚（L6194–6201）
    span: [322092, 322634]
    learn:
      - 先给里面的人一段心里话，再写他在等待中实际消耗了什么，读者先拿到原因。
      - 换到外面只给能闻见的变化。接连两个自语段，第一段从迟疑说到猜测，第二段已敢向自己报喜。
      - 外面的人说得最有把握时就切回里面，用身体的变化交代去向，让读者自己对上前后的事。
    do_not_carry:
      - 封鼎炼人、炉内反而借药修炼的反转，闻不到药香便认定宝药将成的解释。
      - 以泉涌、云霞、火山连写体内变化的比喻组合。
    evidence: [CLAIM-0029, CLAIM-0636, notes/segment-029.md]
  - id: EX-004
    status: candidate
    scene_function: 选石的人离开原位，让一群围观者的迟疑和两个人抢先付钱的行动同时成立。
    locator: 第347章 神坑（L28000–28010）
    span: [1373384, 1373848]
    learn:
      - 招呼下注后先放两句没署名的议论，一个看人的神色，一个算对手手里东西的价值。
      - 旁白用三段挨次写众人想跟、想起上次吃亏、决定观望，然后才让场中人第二次开口问。
      - 用一段写人离石头走远，下一段才写两个人走近。钱落地时仍然看不出石头里有什么。
    do_not_carry:
      - 赌石旁注、借别人敲过的石料抢买、按斤堆出赌本的桥段。
      - 人形奇石的前局和花瓣落在选石者身上的画面。
    evidence: [CLAIM-0119, notes/segment-119.md]
  - id: EX-005
    status: candidate
    scene_function: 借朋友间一次送礼和推让，把修行材料的用途、成色、价钱与购买门槛逐项交代清楚。
    locator: 第602章 西坝（L55254–55261）
    span: [2494884, 2495337]
    learn:
      - 先让人看清有几瓶、瓶里是什么样，再让送的人在劝收时说用途，把说明放在听者用得上的地方。
      - 收礼人推了两次，先说自己用不着，再说留一瓶就够。中间夹一个硬塞过去的动作，换个理由才继续谈。
      - 最后三段一人一轮，依次说哪里可能买到、交易得花多少、自己手头付得起多少。
    do_not_carry:
      - 三瓶金液、送二留一的份数，地脉出产可助人进阶之物的设定。
      - 用赴会赌赢的本金再上拍卖会购药的资金来路和原数额。
    evidence: [CLAIM-0212, notes/segment-212.md]
  - id: EX-006
    status: candidate
    scene_function: 让失亲的孩子自己找听众，陪他散心的人待在林外，给他的想念留出一会儿。
    locator: 第728章 万众瞩目（L67282–67289）
    span: [3024475, 3024940]
    learn:
      - 第一段只安置孩子和听众，第二段让他直接发问。听众一跑，就有了让他往下一处走的理由。
      - 孩子先逐个数想念的亲人，再追问大人用过的时间词。说到最后，只剩眼前的一处伤和一个想念的人。
      - 连过三处小动物，第七段旁观的大人才入画。末段回顾他好几次红着眼睛回来，把眼前片刻放回这些天里。
    do_not_carry:
      - 孤幼是古皇后裔的身世，松鼠、小鸟、伤蝶的次序，海岛松林的布景。
      - 围绕“永远”和“将来”成对追问的原句。
    evidence: [CLAIM-0256, notes/segment-256.md]
  - id: EX-007
    status: candidate
    scene_function: 让受威胁的人当面忍住，只在心里放一句狠话，再用当晚的遭遇检验他的处境。
    locator: 第1141章 第三阶（L102628–102636）
    span: [4676900, 4677361]
    learn:
      - 开头先让拦人者和闯入者对话，当事人隔了一段还只是在看。视线落到逼近的剑上才转进他的心思。
      - 先用贴近人物口气的第三人称埋怨一句，再让第一人称的假设句独占一段，接回旁白说他忍耐的理由。
      - 对方扬言留下，下一段就跳到当晚，给出守卫被突破的结果，让心里的担忧有眼前的根据。
    do_not_carry:
      - 驾着机甲闯闭关地、宗族长辈为玄孙索命的纠纷。
      - 将进阶和一口气杀尽来敌绑在一起的誓语。
    evidence: [CLAIM-0394, notes/segment-394.md]
  - id: EX-008
    status: candidate
    scene_function: 把街上的对峙压到一剑，让没动手的人、突然出手的人和看热闹的人各占一个位置。
    locator: 第1257章 当街杀神骑（L112832–112844）
    span: [5134560, 5135099]
    learn:
      - 先写座中人倒酒、街边人开窗。叫骂之后再写一次他还坐着，这才让另一个身影从店里走出。
      - 出手前用一长段写来人的衣着、面貌和拖在地上的剑。对手刚说完话，让一声响独占一段，随后两段交代这一击。
      - 一击过后转到街上，先给众人一个问句，再点出城里的规矩，末了才有人喊出声。
    do_not_carry:
      - 真身饮酒、紫衣化身拖铁剑现身、坐骑也被一并劈开的动作组合。
      - 编号骑士与城中杀人偿命的设局。
    evidence: [CLAIM-0433, notes/segment-433.md]
  - id: EX-009
    status: candidate
    scene_function: 把一段旧怨带到饭桌上当笑料，等同席的人吃饱了才让他们听懂主人的招待。
    locator: 第1324章 五十（L118526–118539）
    span: [5391528, 5392111]
    learn:
      - 先把旧怨交给远处闲谈的两个人，各说一句。席上的人听得幸灾乐祸，旁白转去写他们吃得尽兴。
      - 主人忽然料定有人要哭。中间隔一个人的愣神，再由另一个人追问，答案只用两个字。
      - 笑话落下后，一个人骂着跑，同桌的却找了个客气的借口离席。
    do_not_carry:
      - 旧驴仇、开驴肉馆、拿马肉招待马的整套包袱。
      - 席上的异兽组合和骂店主的称呼。
    evidence: [CLAIM-0455, notes/segment-455.md]
  - id: EX-010
    status: candidate
    scene_function: 从旧城改道赶路，一段跳过六年，到下一处落脚才恢复到步行看人的速度。
    locator: 第1395章 在路上（L124658–124666）
    span: [5676344, 5676818]
    learn:
      - 进城、召齐同行者、改走哪条路，各给一句着落。只在改道前集中点一次名，跳过几年时就用“他们”。
      - 六年的行程只占一段，留给外人的证据只有偶尔见过他们，下一段直接写落地后身体不适。
      - 到站后连用几段缩小视野，从整颗星的条件，写到当地能否修行，最后落到一路见过谁、没见过谁。
    do_not_carry:
      - 由废弃星路横渡六年、领十二圣者转道的行程，以及各头异兽的名号。
      - 用一颗古星的灵气与故乡相比来说明不宜修行的设定。
    evidence: [CLAIM-0480, notes/segment-480.md]
  - id: EX-011
    status: candidate
    scene_function: 章末两个人同看远处的战场，少年想到争胜，来客却从同一消息里听出重逢的可能。
    locator: 第1612章 第一劫星（L142560–142571）
    span: [6513944, 6514588]
    learn:
      - 先让少年指方向，来客起身就走，对方的劝阻带出他还有伤。等两人真走到高处，再谈地方有多大。
      - 地名和大小由本地人说，接一小段只念地名的心声，再让来客拿自己熟悉的地方默算一次。
      - 倒数第二段让少年用一大段话讲各路高手将来会怎样争斗，末段来客只问能否再见熟人，接一个眼神便收章。
    do_not_carry:
      - 会削人道行的战场、劫星及疆域占比、逢大世便有域外高手来战的规则。
      - 受伤者眺望复苏战场盼见故人，以及用眼中失去光彩又更深邃来收笔的组合。
    evidence: [CLAIM-0552, notes/segment-552.md]
  - id: EX-012
    status: candidate
    scene_function: 两个老同学找吃的，嘴上都推对方先尝，手上却各摘一个，最后一道停下来给同伴留份。
    locator: 第28章 神秘果实（L1715–1730）
    span: [85869, 86538]
    learn:
      - 先问能不能吃，再用两个不署名的对白段互推。前一句夸对方结实，后一句顺着这声夸把差事推回来。
      - 写到动手才点名，先写一个人摘，下一段另一个人也摘。嘴上还在抢谁先，落口时主语已换成两个人。
      - 中间肯花一段写吃相，轮到给朋友留份，只用一提一应两句就停笔。两人已经停手，省得再解释交情。
    do_not_carry:
      - 泉边试吃红果、每人吃四个再给两位同学留果的安排，以及拿钻过人脑的爬虫作备选食物的玩笑。
      - 把果皮比作红玉、连手指和舌头也想吞下去的两处吃相比喻。
    evidence: [CLAIM-0008, notes/segment-008.md]
